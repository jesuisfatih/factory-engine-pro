<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/staff/favicon.svg" />
    <title>Factory Engine Pro Staff</title>
    <style>
      .boot-loader{min-height:100vh;display:grid;place-items:center;background:#f4f5f8;color:#1f2937;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}.boot-loader div{display:grid;justify-items:center;gap:12px}.boot-loader i{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#1d4ed8;border-radius:50%;animation:boot-spin .8s linear infinite}.boot-loader span{color:#6b7280}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-color-scheme:dark){.boot-loader{background:#0a0f1a;color:#e5e7eb}.boot-loader i{border-color:#232938;border-top-color:#60a5fa}.boot-loader span{color:#9ca3af}}
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-loader" role="status" aria-live="polite"><div><i aria-hidden="true"></i><strong>Loading workspace</strong><span>Preparing your dashboard…</span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

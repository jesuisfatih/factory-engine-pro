sync:
  defaults:
    mode: one-way-replica
    ignore:
      vcs: true
      paths:
        - node_modules
        - "**/node_modules"
        - .pnpm-store
        - "**/.pnpm-store"
        - dist
        - "**/dist"
        - build
        - "**/build"
        - .turbo
        - "**/.turbo"
        - .local
        - .tmp
        - "**/.tmp"
        - tmp
        - "**/tmp"
        - .codex-deploy-*
        - "*.tar"
        - "*.tar.gz"
        - "*.zip"
        - uploads
        - "**/uploads"
        - docs/evidence
        - apps/accounts/src/components/main.kcl
        - extensions/customer-account-extension/manifest.json
        - .env
        - ".env.*"
        - docker-compose.yml
        - docker-compose.*.yml
        - depot.json
        - build-meta.json
        - "*.log"
        - "*.dump"
        - "*.sqlite"
        - .claude
        - .agent
        - .gemini
        - .shopify
        - .funclib

  factory-engine-pro-dtfbank:
    alpha: "C:/Users/mhmmd/Desktop/factory-engine-pro"
    beta: "root@144.202.125.169:/opt/apps/custom/factoryengine/factory-engine-pro-dtfbank"

  factory-engine-pro-eagledtfprint:
    alpha: "C:/Users/mhmmd/Desktop/factory-engine-pro"
    beta: "root@144.202.125.169:/opt/apps/custom/factoryengine/factory-engine-pro-eagledtfprint"

  factory-engine-pro-eagledtfsupply:
    alpha: "C:/Users/mhmmd/Desktop/factory-engine-pro"
    beta: "root@144.202.125.169:/opt/apps/custom/factoryengine/factory-engine-pro-eagledtfsupply"

  factory-engine-pro-fastdtftransfer:
    alpha: "C:/Users/mhmmd/Desktop/factory-engine-pro"
    beta: "root@144.202.125.169:/opt/apps/custom/factoryengine/factory-engine-pro-fastdtftransfer"

  factory-engine-pro-fastdtfsupply:
    alpha: "C:/Users/mhmmd/Desktop/factory-engine-pro"
    beta: "root@144.202.125.169:/opt/apps/custom/factoryengine/factory-engine-pro-fastdtfsupply"

  factory-engine-pro-dtfprintdepot:
